[package]
name = "listener-type"
version = "1.0.5"
description = "Listener Type — local voice input that types where your cursor is"
authors = ["Listener Type"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "listener_type_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compile antirez/qwen-asr C sources for the local ASR engine on macOS.
cc = "1.1"

[dependencies]
# 锁 ~2.11 因为 npm @tauri-apps/api 与 plugin-dialog 都已升 2.11；
# tauri build 跨 minor 一致性检查会拒绝 npm 2.11 + Rust 2.10 的组合。
tauri = { version = "~2.11", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "native-tls", "stream", "system-proxy"] }
zip = "2"
thiserror = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
simplelog = "0.12"
parking_lot = "0.12"
once_cell = "1"
pinyin = "0.10"
serialport = "4.7"
espflash = { version = "=3.2.0", default-features = false, features = ["serialport"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
url = "2"
raw-window-handle = "0.6"
ferrous-opencc = "0.4"
denzic-ota-core = { path = "../third_party/denzic-platform/ota/host/rust" }
denzic-audio-v1-core = { path = "../third_party/denzic-platform/audio/host/rust" }
denzic-device-control-v1-core = { path = "../third_party/denzic-platform/device_control/host/rust" }
denzic-observability-v1-core = { path = "../third_party/denzic-platform/observability/host/rust" }
denzic-speaker-verification-v1-core = { path = "../third_party/denzic-platform/speaker_verification/host/rust" }
denzic-voice-activation-v1-core = { path = "../third_party/denzic-platform/voice_activation/host/rust" }
denzic-ble-windows = { path = "../third_party/denzic-platform/ble_windows/host/rust" }
denzic-ble-pairing = { path = "../third_party/denzic-platform/ble_pairing/host/rust" }
denzic-host-audio-v1-core = { path = "../third_party/denzic-platform/host_audio/host/rust" }

# Hotkey + audio + insertion
global-hotkey = "0.6"
cpal = "0.15"
enigo = "0.2"
arboard = "3"
rdev = "0.5"

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3.6.3"
default-features = false
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3.6.3"
default-features = false
features = ["windows-native"]

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies.keyring]
version = "3.6.3"
default-features = false
features = ["linux-native-sync-persistent", "crypto-rust"]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5"
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.5"
objc2-foundation = "0.2"
objc2-app-kit = "0.2"
# antirez/qwen-asr 用 malloc 分配返回字符串，必须用 C `free()` 释放。
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.22"
bzip2 = "0.4"
foundry-local-sdk = { version = "1.1.0", features = ["winml"] }
libloading = "0.8"
raw-window-handle = "0.6"
tar = "0.4"
windows = { version = "0.58", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"

# 跨平台磨砂层（macOS NSVisualEffectView / Windows Mica）。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# release 编译在这个 23GB 机器上单 rustc LLVM 阶段会 OOM（STATUS_STACK_BUFFER_OVERRUN）。
# 提高 codegen-units 把单 crate 拆成更小的 LLVM 模块，降低峰值内存，代价是极小的跨单元优化损失。
[profile.release]
codegen-units = 32
