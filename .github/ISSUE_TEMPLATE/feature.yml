name: Feature request
description: Propose a Listener Type product improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Product problem
      description: Describe the workflow or user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Explain the expected recording, recognition, writing, output, or device experience.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance example
      description: Give one concrete before/after example or a reproducible success condition.
