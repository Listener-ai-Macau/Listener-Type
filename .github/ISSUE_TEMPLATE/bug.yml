name: Bug report
description: Report a Listener Type defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux/dev only
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Listener Type version
      placeholder: 1.0.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include permissions, provider, hotkey mode and target app when relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted evidence
      description: Add a short `listener-type.log` excerpt or diagnostic export. Remove credentials, personal transcripts, recordings, names, device identifiers, and unrelated application content.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the evidence and removed private data.
          required: true
