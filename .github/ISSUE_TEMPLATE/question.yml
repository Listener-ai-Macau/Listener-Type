name: Question / support
description: Ask about setup, expected behavior, or supported configurations
title: "[Question]: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Listener Type version
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux / development only
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Safe context
      description: Include minimal steps and redacted logs only. Never attach keys, recordings, transcripts, or private diagnostics.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed credentials, recordings, transcripts, personal data, and private paths.
          required: true
