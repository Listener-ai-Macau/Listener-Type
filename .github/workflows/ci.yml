name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  repository-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: npm run check:brand
      - run: npm run check:cloud
      - run: npm run check:traceability

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve pinned Denzic Platform commit
        id: platform-ref
        run: echo "commit=$(git rev-parse HEAD:third_party/denzic-platform)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Listener-ai-Macau/Denzic-Platform
          ref: ${{ steps.platform-ref.outputs.commit }}
          path: third_party/denzic-platform
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve pinned Denzic Platform commit
        id: platform-ref
        run: echo "commit=$(git rev-parse HEAD:third_party/denzic-platform)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Listener-ai-Macau/Denzic-Platform
          ref: ${{ steps.platform-ref.outputs.commit }}
          path: third_party/denzic-platform
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - run: npm ci
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
