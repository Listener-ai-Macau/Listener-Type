name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  public-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm run check:open-source
      - run: git diff --check

  frontend-and-audits:
    # Full builds currently require the separately hosted Denzic Platform
    # submodule. Fork pull requests still receive the public-hygiene gate.
    if: github.repository == 'Listener-ai-Macau/Listener-Type'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve pinned Denzic Platform commit
        id: platform-ref
        run: echo "commit=$(git rev-parse HEAD:third_party/denzic-platform)" >> "$GITHUB_OUTPUT"
      - name: Require Denzic Platform deploy key
        env:
          DENZIC_PLATFORM_DEPLOY_KEY: ${{ secrets.DENZIC_PLATFORM_DEPLOY_KEY }}
        run: test -n "$DENZIC_PLATFORM_DEPLOY_KEY" || { echo "Missing read-only DENZIC_PLATFORM_DEPLOY_KEY repository secret" >&2; exit 1; }
      - uses: actions/checkout@v6
        with:
          repository: Listener-ai-Macau/Denzic-Platform
          ref: ${{ steps.platform-ref.outputs.commit }}
          path: third_party/denzic-platform
          ssh-key: ${{ secrets.DENZIC_PLATFORM_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:brand
      - run: npm run check:cloud
      - run: npm run check:traceability

  rust-check:
    if: github.repository == 'Listener-ai-Macau/Listener-Type'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve pinned Denzic Platform commit
        id: platform-ref
        run: echo "commit=$(git rev-parse HEAD:third_party/denzic-platform)" >> "$GITHUB_OUTPUT"
      - name: Require Denzic Platform deploy key
        env:
          DENZIC_PLATFORM_DEPLOY_KEY: ${{ secrets.DENZIC_PLATFORM_DEPLOY_KEY }}
        run: test -n "$DENZIC_PLATFORM_DEPLOY_KEY" || { echo "Missing read-only DENZIC_PLATFORM_DEPLOY_KEY repository secret" >&2; exit 1; }
      - uses: actions/checkout@v6
        with:
          repository: Listener-ai-Macau/Denzic-Platform
          ref: ${{ steps.platform-ref.outputs.commit }}
          path: third_party/denzic-platform
          ssh-key: ${{ secrets.DENZIC_PLATFORM_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - run: npm ci
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
