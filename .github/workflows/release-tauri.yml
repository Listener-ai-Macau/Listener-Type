name: Release Tauri

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-tauri'

jobs:
  windows-release-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve pinned Denzic Platform commit
        id: platform-ref
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD:third_party/denzic-platform
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          repository: Listener-ai-Macau/Denzic-Platform
          ref: ${{ steps.platform-ref.outputs.commit }}
          path: third_party/denzic-platform
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Windows package
        shell: pwsh
        run: |
          npm ci
          node scripts/windows-package-msvc.test.mjs
          pwsh -NoProfile -File scripts/windows-package-msvc.ps1
      - name: Discover WiX tools
        shell: pwsh
        run: |
          $tauriWixRoot = Join-Path $env:LOCALAPPDATA "tauri"
          $light = Get-ChildItem -LiteralPath $tauriWixRoot -Directory -Filter "WixTools*" -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "light.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $light) { throw "WixTools*\light.exe not found" }
